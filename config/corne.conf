# Enable ZMK Studio (live keymap editing)
CONFIG_ZMK_STUDIO=y

# Deep sleep after 15 minutes idle (big battery win)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Display: nice!view (Sharp memory LCD, SPI).
# This flag alone is NOT enough for a nice!view — build.yaml must also carry the
# `nice_view_adapter nice_view` shields on both halves, or you get a green build
# and blank screens with no error. (A plain OLED needs only this flag.)
CONFIG_ZMK_DISPLAY=y

# Optional: invert the nice!view status widget
# CONFIG_NICE_VIEW_WIDGET_INVERTED=y

# Report BOTH halves' battery, not just the one you are looking at.
# FETCHING = central pulls the peripheral's level over BLE.
# PROXY    = central republishes it to the host.
# ZMK requires both; either one alone does nothing useful.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Bluetooth only, no USB output
# CONFIG_ZMK_USB=n

# Logging over USB — useful for debugging, costs battery
# CONFIG_ZMK_USB_LOGGING=y

# Required for the NAV layer mouse keys (&mmv / &mkp)
CONFIG_ZMK_POINTING=y
